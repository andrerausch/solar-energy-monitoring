esphome:
  name: em24-solar
  friendly_name: EM24-Solar

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Em24-Solar Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

uart:
  id: modbus_uart
  tx_pin: 17
  rx_pin: 16
  baud_rate: 9600
  stop_bits: 1
  parity: none

modbus:
  - id: modbus1
    uart_id: modbus_uart
    send_wait_time: 500ms
    flow_control_pin: 4

modbus_controller:
  - id: em24_1
    modbus_id: modbus1
    address: 1
    command_throttle: 100ms
    update_interval: 5000ms

  - id: em24_2
    modbus_id: modbus1
    address: 2
    command_throttle: 100ms
    update_interval: 5000ms

sensor:
  # EM24 Sensor 1

  # Read Current W sum (L1+L2+L3)
  - platform: modbus_controller
    modbus_controller_id: em24_1
    id: em24_1_w_sum
    name: "EM24_1 W SUM"
    register_type: holding
    address: 0x0028
    register_count: 2
    value_type: S_DWORD_R
    unit_of_measurement: "W"
    filters: 
      - multiply: 0.1


  # EM24 Sensor 2

  # Read Current W sum (L1+L2+L3)
  - platform: modbus_controller
    modbus_controller_id: em24_2
    id: em24_2_w_sum
    name: "EM24_2 W SUM"
    register_type: holding
    address: 0x0028
    register_count: 2
    value_type: S_DWORD_R
    unit_of_measurement: "W"
    filters: 
      - multiply: 0.1